<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="800" height="180" shape-rendering="geometricPrecision" role="img" aria-label="VPSAgent — Give your AI agent a $5 VPS, safely.">
  <defs>
    <linearGradient id="bg-dark" x1="0" y1="0" x2="800" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#070707"/>
    </linearGradient>
  </defs>
  <rect width="800" height="180" rx="12" fill="url(#bg-dark)" stroke="#232323" stroke-width="1"/>
  <!-- Subtle architectural grid -->
  <g stroke="#151515" stroke-width="1">
    <line x1="0" y1="45" x2="800" y2="45"/>
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="135" x2="800" y2="135"/>
    <line x1="200" y1="0" x2="200" y2="180"/>
    <line x1="400" y1="0" x2="400" y2="180"/>
    <line x1="600" y1="0" x2="600" y2="180"/>
  </g>
  <!-- High-resolution geometric V emblem (68x68 at x=48, y=56) -->
  <g transform="translate(48, 56)">
    <rect width="68" height="68" rx="14" fill="#141414" stroke="#2e2e2e" stroke-width="1.25"/>
    <!-- Left facet -->
    <path d="M 15 18 L 25.5 18 L 34 40.5 L 34 52 L 29 52 Z" fill="#ffffff"/>
    <!-- Right facet -->
    <path d="M 53 18 L 42.5 18 L 34 40.5 L 34 52 L 39 52 Z" fill="#ffffff" fill-opacity="0.65"/>
  </g>
  <!-- Title & Tagline -->
  <text x="140" y="86" fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="3">VPSAGENT</text>
  <text x="140" y="116" fill="#a3a3a3" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">Give your AI agent a $5 VPS, safely.</text>
  <!-- Right-side status badge -->
  <rect x="598" y="73" width="154" height="34" rx="8" fill="#141414" stroke="#2e2e2e" stroke-width="1"/>
  <circle cx="618" cy="90" r="4" fill="#ffffff"/>
  <text x="632" y="94.5" fill="#e5e5e5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="500">Remote MCP v2</text>
</svg>
